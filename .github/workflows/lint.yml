name: "Linting"

on:
  pull_request:
    branches:
      - "*"
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - ".eslintrc.cjs"
      - ".eslintignore"
      - ".prettierrc"
      - ".prettierignore"
      - "etc/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  push:
    branches:
      - "develop"
      - "main"
      - "master"
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - ".eslintrc.cjs"
      - ".eslintignore"
      - ".prettierrc"
      - ".prettierignore"
      - "etc/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: |
          # ci: install exact versions from package-lock.json
          #     fast, secure, predictable compared to npm install
          npm ci
          npm run check
