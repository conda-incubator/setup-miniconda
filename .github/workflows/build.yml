name: "Build"

on:
  pull_request:
    branches:
      - "*"
    paths: &build_paths
      - "src/**"
      - "!src/__tests__/**"
      - "dist/**"
      - "action.yml"
      - "etc/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
  push:
    branches:
      - "develop"
      - "main"
      - "master"
    paths: *build_paths

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Build
        run: |
          # ci: install exact versions from package-lock.json
          #     fast, secure, predictable compared to npm install
          npm ci
          npm run build

      - name: Check that all built are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Uncommitted changes detected after build."
            echo ""
            echo "Changed files:"
            git status --short
            echo ""
            echo "Diff:"
            git diff --stat
            echo ""
            echo "Please run locally with the same Node version as CI:"
            echo "  npm ci"
            echo "  npm run format"
            echo "  npm run build"
            echo "and commit the resulting changes before pushing."
            exit 1
          fi
